AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: ILORA.ai Rent Collector - MCP server (Streamable HTTP) and page on AWS Lambda; NVIDIA Nemotron on Nebius Token Factory picks the steps and PayPal Invoicing (sandbox) bills the tenants.

Parameters:
  Brain:
    Type: String
    Default: nemotron
    AllowedValues: [offline, nemotron]
    Description: 'Which model picks the tool. nemotron calls NVIDIA Nemotron on Nebius Token Factory (billed per token).'
  NebiusApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: 'Nebius Token Factory API key, needed when Brain is nemotron.'
  PayPalClientId:
    Type: String
    NoEcho: true
    Default: ""
    Description: 'PayPal REST app client id (sandbox). Without it the invoice tools say PayPal is not connected.'
  PayPalClientSecret:
    Type: String
    NoEcho: true
    Default: ""
    Description: 'PayPal REST app secret (sandbox).'
  Voice:
    Type: String
    Default: polly
    AllowedValues: [browser, polly]
    Description: 'polly reads answers with an Amazon Polly generative voice (billed per character).'

Conditions:
  UsePolly: !Equals [!Ref Voice, polly]

Resources:
  McpFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .lambda/
      Handler: index.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 512
      # A portfolio review makes about eight model calls in one turn of the page; each is one request here.
      Timeout: 30
      # No reserved concurrency: the account's spare capacity is at its minimum. Spending is bounded by the
      # per-caller and total hourly caps on /api/brain and /api/speak instead.
      Environment:
        Variables:
          ILORA_DATA_DIR: /var/task/data
          SIMULATOR_DIR: /var/task/simulator
          BRAIN: !Ref Brain
          NEBIUS_API_KEY: !Ref NebiusApiKey
          PAYPAL_CLIENT_ID: !Ref PayPalClientId
          PAYPAL_CLIENT_SECRET: !Ref PayPalClientSecret
          VOICE: !Ref Voice
          POLLY_ENGINE: generative
          POLLY_VOICE: Ruth
      FunctionUrlConfig:
        AuthType: NONE
      Policies:
        - !If
          - UsePolly
          - Statement:
              - Effect: Allow
                Action: [polly:SynthesizeSpeech]
                Resource: "*"
          - !Ref AWS::NoValue

Outputs:
  McpEndpoint:
    Description: MCP Streamable HTTP endpoint
    Value: !Sub "${McpFunctionUrl.FunctionUrl}mcp"
  AnalystUrl:
    Description: ILORA.ai Rent Collector page
    Value: !GetAtt McpFunctionUrl.FunctionUrl
